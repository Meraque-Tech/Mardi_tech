base_receiver:
  ros__parameters:
    port: ""
    baud: 115200
    frame_id: gps
    stale_timeout: 3.0
    reconnect_interval: 2.0
    rtk_status_topic: /gnss/rtk_status

gnss_enu:
  ros__parameters:
    fix_topic: /receiver/fix
    output_topic: /gps/enu_position
    frame_id: enu
    is_forward_topic: /gnss/is_forward
    is_backward_topic: /gnss/is_backward
    north_deadband_m: 1.0
    direction_stale_timeout: 3.0

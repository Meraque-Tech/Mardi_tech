name: base-receiver

services:
  base_receiver:
    image: meraquetech/race_nav:base_receiver.v5
    build: .
    container_name: base_receiver
    hostname: mardi
    user: "0:0"
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    network_mode: host
    ipc: host
    privileged: true
    group_add:
      - "20"
    command:
      - ros2
      - launch
      - base_receiver
      - receiver.launch.py

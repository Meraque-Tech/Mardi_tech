name: base-receiver

services:
  base_receiver:
    image: meraquetech/race_nav:base_receiver.v5
    build: .
    container_name: base_receiver
    hostname: mardi
    user: "0:0"
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    network_mode: host
    ipc: host
    privileged: true
    group_add:
      - "20"
    command:
      - ros2
      - launch
      - base_receiver
      - receiver.launch.py

# Usage:
#   docker compose -f docker-compose.base_receiver.yaml build
#   docker compose -f docker-compose.base_receiver.yaml up -d
#   docker compose -f docker-compose.base_receiver.yaml exec base_receiver bash
#   docker compose -f docker-compose.base_receiver.yaml logs -f
#   docker compose -f docker-compose.base_receiver.yaml restart
#   docker compose -f docker-compose.base_receiver.yaml down
#
# Rebuild and recreate after Dockerfile changes:
#   docker compose -f docker-compose.base_receiver.yaml up -d --build --force-recreate

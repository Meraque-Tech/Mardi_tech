gnss_fix_enu_odom:
  ros__parameters:
    fix_topic: /receiver/fix
    rtk_status_topic: /gnss/rtk_status
    odom_topic: /gnss/odom
    path_topic: /gnss/path
    is_forward_topic: /gnss/is_forward
    is_backward_topic: /gnss/is_backward

    map_frame: map
    base_frame: gnss_base_link

    require_rtk: false
    min_heading_distance: 0.5
    stationary_timeout_s: 5.0
    direction_stale_timeout_s: 3.0
    reversal_angle_deg: 150.0
    direction_consistency_deg: 30.0
    heading_variance: 0.05
    fallback_horizontal_variance: 1.0
    fallback_vertical_variance: 4.0

    two_d_mode: true
    publish_tf: true
    path_max_poses: 5000

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NN Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/graph.css">
  <link rel="stylesheet" href="css/training.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="12" r="2"/>
          <path d="M7 6h6a4 4 0 0 1 4 4M7 18h6a4 4 0 0 0 4-4"/>
        </svg>
      </div>
      <div>
        <h1>NN Builder</h1>
        <div class="subtitle">Visual PyTorch architecture editor</div>
      </div>
    </div>
    <div class="header-right">
      <span id="ws-status" class="status-bad">Disconnected</span>
    </div>
  </header>

  <nav class="nav-bar">
    <button class="nav-item active" data-tab="editor-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="13" width="7" height="7" rx="1.5"/><path d="M10 7.5h4a2 2 0 0 1 2 2V13"/></svg>
      Editor
    </button>
    <button class="nav-item" data-tab="training-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      Training
    </button>
  </nav>

  <nav class="nav-bar toolbar">
    <button class="btn" id="btn-new" title="Start a new blank graph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New
    </button>
    <button class="btn" id="btn-validate" title="Structural + shape validation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
      Validate
    </button>
    <button class="btn" id="btn-build" title="Build the module and report parameter count">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 6 6 .9-4.5 4.4 1 6.2-5.5-3-5.5 3 1-6.2L3 8.9 9 8z"/></svg>
      Build
    </button>
    <button class="btn" id="btn-export" title="Download a standalone train.py">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
      Export .py
    </button>
    <span style="flex:1"></span>
    <input id="graph-name" type="text" placeholder="graph name" style="width:150px" />
    <button class="btn" id="btn-save" title="Save this graph to the server">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      Save
    </button>
    <select id="saved-graphs"><option value="">Load saved…</option></select>
    <button class="btn danger icon" id="btn-delete" title="Delete the selected saved graph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6h12z"/></svg>
    </button>
  </nav>

  <main style="flex:1; display:flex; min-height:0;">
    <section id="editor-tab" class="tab-page active">
      <div id="palette"></div>
      <div id="canvas-wrap">
        <div class="canvas-toolbar">
          <button class="btn icon" id="btn-zoom-reset" title="Reset pan/zoom">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
        <canvas id="node-canvas"></canvas>
        <div class="canvas-hint">Drag from palette to add nodes · drag a node's right dot to an input dot to connect · Delete key removes selection</div>
      </div>
      <div id="inspector"></div>
    </section>

    <section id="training-tab" class="tab-page"></section>
  </main>

  <div id="toast" class="toast" style="display:none;"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NN Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/graph.css">
  <link rel="stylesheet" href="css/training.css">
</head>
<body>
  <header class="header">
    <h1>NN Builder</h1>
    <div class="header-right">
      <span>WebSocket:</span>
      <span id="ws-status" class="status-bad">Disconnected</span>
    </div>
  </header>

  <nav class="nav-bar">
    <button class="nav-item active" data-tab="editor-tab">Editor</button>
    <button class="nav-item" data-tab="training-tab">Training</button>
  </nav>

  <nav class="nav-bar" style="border-top:1px solid rgba(255,255,255,0.05); gap:0.4rem; padding:0.4rem 1rem;">
    <button class="btn" id="btn-new">New</button>
    <button class="btn" id="btn-validate">Validate</button>
    <button class="btn" id="btn-build">Build</button>
    <button class="btn" id="btn-export">Export .py</button>
    <span style="flex:1"></span>
    <input id="graph-name" type="text" placeholder="graph name" style="width:140px" />
    <button class="btn" id="btn-save">Save</button>
    <select id="saved-graphs"><option value="">Load saved…</option></select>
    <button class="btn danger" id="btn-delete">Delete</button>
  </nav>

  <main style="flex:1; display:flex; min-height:0;">
    <section id="editor-tab" class="tab-page active">
      <div id="palette"></div>
      <div id="canvas-wrap">
        <div class="canvas-toolbar">
          <button class="btn" id="btn-zoom-reset">Reset View</button>
        </div>
        <canvas id="node-canvas"></canvas>
        <div class="canvas-hint">Drag from palette to add nodes · drag from a node's right dot to an input dot to connect · Delete key removes selection</div>
      </div>
      <div id="inspector"></div>
    </section>

    <section id="training-tab" class="tab-page"></section>
  </main>

  <div id="toast" class="toast" style="display:none;"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

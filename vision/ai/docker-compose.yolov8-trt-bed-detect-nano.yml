version: "3.3"

services:
  yolov8-trt-bed-detect:
    image: meraquetech/race_nav:yolov8-trt-bed-detect-nano.v6
    container_name: yolov8-trt-bed-detect-nano
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - ./yolov8/weights:/weights
      - ./yolov8_trt_bed_detect/config:/ros2_ws/install/yolov8_trt_bed_detect/share/yolov8_trt_bed_detect/config
      - ./yolov8_trt_bed_detect/launch:/ros2_ws/install/yolov8_trt_bed_detect/share/yolov8_trt_bed_detect/launch
      - ./saved_frames:/saved_frames
    network_mode: host
    ipc: host
    privileged: true
    runtime: nvidia
    command: >
      bash -c "source /opt/ros/humble/install/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch yolov8_trt_bed_detect bed_detect.launch.py"
    restart: unless-stopped

# Usage:
#   docker compose -f docker-compose.yolov8-trt-bed-detect-nano.yml up -d
#   docker compose -f docker-compose.yolov8-trt-bed-detect-nano.yml logs -f
#   docker compose -f docker-compose.yolov8-trt-bed-detect-nano.yml down
#
# Dashboard:    http://<host-ip>:8090/
# MJPEG stream: http://<host-ip>:8080/
#
# ros2 topic echo /class_counts
# ros2 param set /yolov8_trt is_track true

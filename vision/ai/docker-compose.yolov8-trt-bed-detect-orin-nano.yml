services:
  yolov8-trt-bed-detect-orin:
    image: meraquetech/race_nav:yolov8-trt-bed-detect-orin-nano.v4
    container_name: yolov8-trt-bed-detect-orin-nano
    build:
      context: .
      dockerfile: Dockerfile.yolov8_trt_bed_detect_jetson_orien_nano
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - GNSS_FIX_TOPIC=/receiver/fix
      - GNSS_STALE_TIMEOUT=3.0
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
    volumes:
      - ./yolov8/weights:/weights
      - ./yolov8_trt_bed_detect_orin/config:/ros2_ws/install/yolov8_trt_bed_detect_orin/share/yolov8_trt_bed_detect_orin/config
      - ./yolov8_trt_bed_detect_orin/launch:/ros2_ws/install/yolov8_trt_bed_detect_orin/share/yolov8_trt_bed_detect_orin/launch
      - ./saved_frames:/saved_frames
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    runtime: nvidia
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch yolov8_trt_bed_detect_orin bed_detect.launch.py"

# Usage:
#   mkdir -p saved_frames
#   docker compose -f docker-compose.yolov8-trt-bed-detect-orin-nano.yml build
#   docker compose -f docker-compose.yolov8-trt-bed-detect-orin-nano.yml up -d
#   docker compose -f docker-compose.yolov8-trt-bed-detect-orin-nano.yml exec yolov8-trt-bed-detect-orin bash
#   docker compose -f docker-compose.yolov8-trt-bed-detect-orin-nano.yml logs -f
#   docker compose -f docker-compose.yolov8-trt-bed-detect-orin-nano.yml down

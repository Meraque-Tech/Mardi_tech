services:
  yolov8-trt-serialize-orin-nano:
    image: meraquetech/race_nav:yolov8-trt-bed-detect-orin-nano.v9
    container_name: yolov8-trt-serialize-orin-nano
    # build:
    #   context: .
    #   dockerfile: Dockerfile.yolov8_trt_bed_detect_jetson_orien_nano
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    
    volumes:
      # - ./yolov8/weights:/weights
      - ${HOME}/yolov8/weights:/weights
      - ./yolov8_trt_bed_detect_orin/config:/ros2_ws/install/yolov8_trt_bed_detect_orin/share/yolov8_trt_bed_detect_orin/config
      - ./yolov8_trt_bed_detect_orin/launch:/ros2_ws/install/yolov8_trt_bed_detect_orin/share/yolov8_trt_bed_detect_orin/launch
      - ${HOME}/saved_frames:/saved_frames
    runtime: nvidia
    restart: "no"
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch yolov8_trt_bed_detect_orin serialize_engine.launch.py"

  yolov8-trt-bed-detect-orin:
    image: meraquetech/race_nav:yolov8-trt-bed-detect-orin-nano.v9
    container_name: yolov8-trt-bed-detect-orin-nano
    build:
      context: .
      dockerfile: Dockerfile.yolov8_trt_bed_detect_jetson_orien_nano
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - GNSS_FIX_TOPIC=/receiver/fix
      - GNSS_STALE_TIMEOUT=3.0
      - HOST_WEIGHTS_DIR=${HOME}/yolov8/weights
      - HOST_YOLOV8_DIR=${PWD}/yolov8
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
    volumes:
      # - ./yolov8/weights:/weights
      - ${HOME}/yolov8/weights:/weights
      - ./yolov8_trt_bed_detect_orin/config:/ros2_ws/install/yolov8_trt_bed_detect_orin/share/yolov8_trt_bed_detect_orin/config
      - ./yolov8_trt_bed_detect_orin/launch:/ros2_ws/install/yolov8_trt_bed_detect_orin/share/yolov8_trt_bed_detect_orin/launch
      - ${HOME}/saved_frames:/saved_frames
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    runtime: nvidia
    # depends_on:
    #   yolov8-trt-serialize-orin-nano:
    #     condition: service_completed_successfully
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch yolov8_trt_bed_detect_orin yolov8_web.launch.py"

# Usage:
#   mkdir -p saved_frames
#   docker compose -f docker-compose.yolov8-trt-bed-detect-orin-nano.yml build
#   docker compose -f docker-compose.yolov8-trt-bed-detect-orin-nano.yml run --rm yolov8-trt-serialize-orin-nano
#   docker compose -f docker-compose.yolov8-trt-bed-detect-orin-nano.yml up yolov8-trt-bed-detect-orin
#   docker compose -f docker-compose.yolov8-trt-bed-detect-orin-nano.yml up -d yolov8-trt-bed-detect-orin
#   docker compose -f docker-compose.yolov8-trt-bed-detect-orin-nano.yml exec yolov8-trt-bed-detect-orin bash
#   docker compose -f docker-compose.yolov8-trt-bed-detect-orin-nano.yml logs -f
#   docker compose -f docker-compose.yolov8-trt-bed-detect-orin-nano.yml down

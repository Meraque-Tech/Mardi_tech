services:
  yolov8-training-web:
    image: meraquetech/race_nav:yolov8-training-web.v5
    build:
      context: ../../..
      dockerfile: vision/ai/web/Dockerfile.cuda
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    container_name: yolov8-training-web
    shm_size: "8gb"
    env_file:
      - .env
    environment:
      YOLO_CONFIG_DIR: /tmp
    network_mode: host
    volumes:
      - ../../..:/app
      - ./datasets:/app/vision/ai/web/datasets
      - ./logs:/app/vision/ai/web/logs
      - ../../../runs:/app/runs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

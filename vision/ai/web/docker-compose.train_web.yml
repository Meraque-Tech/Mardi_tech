services:
  yolov8-training-web:
    image: meraquetech/race_nav:yolov8-training-web.v15
    build:
      context: ../../..
      dockerfile: vision/ai/web/Dockerfile.cuda
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
        BAKE_PRETRAINED_WEIGHTS: "${BAKE_PRETRAINED_WEIGHTS:-1}"
        INSTALL_DFINE: "${INSTALL_DFINE:-1}"
        DFINE_REPO_URL: "${DFINE_REPO_URL:-https://github.com/Peterande/D-FINE.git}"
        DFINE_REPO_REF: "${DFINE_REPO_REF:-}"
    container_name: yolov8-training-web
    restart: unless-stopped
    shm_size: "8gb"
    env_file:
      - .env
    environment:
      YOLO_CONFIG_DIR: /home/appuser/.config/Ultralytics
      ULTRALYTICS_WEIGHTS_DIR: /home/appuser/.cache/ultralytics/weights
      RFDETR_CACHE_DIR: /home/appuser/.roboflow/models
      DFINE_REPO_DIR: /opt/D-FINE
    network_mode: host
    command: ["uvicorn", "vision.ai.web.app:app", "--host", "${WEB_HOST:-0.0.0.0}", "--port", "8000"]
    volumes:
      - ../../..:/app
      - ./datasets:/app/vision/ai/web/datasets
      - ./logs:/app/vision/ai/web/logs
      - ../../../runs:/app/runs
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

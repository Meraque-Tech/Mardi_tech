services:
  imu_gnss_raw:
    image: meraquetech/race_nav:sf.humble.v3
    container_name: imu_gnss_raw
    build:
      context: ./vision/sf/
      dockerfile: Dockerfile.sf.humble
      # Same reasoning as yolov8-trt-bed-detect-x86-jazzy below: use the
      # local humble.sensors.dep_jetson image as-is instead of checking the
      # registry for a newer digest on every `docker compose build`.
      # pull_policy: never
    command: >
      ros2 launch rtk_localization gnss_imu_eskf.launch.py
    # ros2 launch rtk_localization imu_gps_raw.launch.py
    tty: true
    hostname: imu_gnss_raw
    user: "0:0"
    privileged: true
    group_add:
      - "20"
    network_mode: host
    ipc: host
    restart: always
    stop_grace_period: 5s
    tmpfs:
      - /tmp
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:rw
      - ./cyclone_dds_profile.xml:/dds_ws/cyclone_dds_profile.xml:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - HOME=/tmp
      - ROS_HOME=/tmp/ros
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///dds_ws/cyclone_dds_profile.xml
  
  yolov8-trt-bed-detect-orin:
    image: meraquetech/race_nav:yolov8-trt-bed-detect-orin-nano.v5
    container_name: yolov8-trt-bed-detect-orin-nano
    build:
      context: ./vision/ai/
      dockerfile: Dockerfile.yolov8_trt_bed_detect_jetson_orien_nano
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - GNSS_FIX_TOPIC=/receiver/fix
      - MOTION_STATE_TOPIC=/gnss_imu_eskf/motion_state_raw_gnss
      - MOTION_POS_DEADBAND_TOPIC=/gnss_imu_eskf/motion_pos_deadband
      - MOTION_POS_DEADBAND_M=0.3
      - GNSS_STALE_TIMEOUT=3.0
      - AUTO_SAVE_MIN_DISTANCE_M=0.3
      - HOST_WEIGHTS_DIR=${HOME}/yolov8/weights
      - HOST_YOLOV8_DIR=${PWD}/yolov8
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///dds_ws/cyclone_dds_profile.xml
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
    volumes:
      # - ./yolov8/weights:/weights
      - ${HOME}/yolov8/weights:/weights
      - ./cyclone_dds_profile.xml:/dds_ws/cyclone_dds_profile.xml:ro
      - ./vision/ai/yolov8_trt_bed_detect_orin/config:/ros2_ws/install/yolov8_trt_bed_detect_orin/share/yolov8_trt_bed_detect_orin/config
      - ./vision/ai/yolov8_trt_bed_detect_orin/launch:/ros2_ws/install/yolov8_trt_bed_detect_orin/share/yolov8_trt_bed_detect_orin/launch
      - ${HOME}/saved_frames:/saved_frames
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    runtime: nvidia
    restart: always
    # depends_on:
    #   yolov8-trt-serialize-orin-nano:
    #     condition: service_completed_successfully
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch yolov8_trt_bed_detect_orin yolov8_web.launch.py"
  
  yolov8-trt-bed-detect-x86-jazzy:
    image: meraquetech/race_nav:yolov8-trt-bed-detect-x86.ros2.jazzy.v8
    container_name: yolov8-trt-bed-detect-x86-jazzy
    build:
      context: ./vision/ai/
      dockerfile: Dockerfile.yolov8_trt_x86.ros2.jazzy
      # Use the local yolov8-trt-x86.dep image as-is instead of checking the
      # registry for a newer digest on every `docker compose build` -- that
      # registry check is what was re-pulling several GB of the CUDA/
      # TensorRT base layers on every build even with no source changes.
      # pull_policy: never
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - GNSS_FIX_TOPIC=/receiver/fix
      - MOTION_STATE_TOPIC=/gnss_imu_eskf/motion_state_raw_gnss
      - MOTION_POS_DEADBAND_TOPIC=/gnss_imu_eskf/motion_pos_deadband
      - MOTION_POS_DEADBAND_M=0.3
      - GNSS_STALE_TIMEOUT=3.0
      - AUTO_SAVE_MIN_DISTANCE_M=0.3
      - HOST_WEIGHTS_DIR=${HOME}/yolov8/weights
      - HOST_YOLOV8_DIR=${PWD}/yolov8
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///dds_ws/cyclone_dds_profile.xml
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      # - /dev/video4:/dev/video4
    volumes:
      - ${HOME}/yolov8/weights:/weights
      - ./cyclone_dds_profile.xml:/dds_ws/cyclone_dds_profile.xml:ro
      - ./vision/ai/yolov8_trt_bed_detect_orin/config:/ros2_ws/install/yolov8_trt_bed_detect_orin/share/yolov8_trt_bed_detect_orin/config
      - ./vision/ai/yolov8_trt_bed_detect_orin/launch:/ros2_ws/install/yolov8_trt_bed_detect_orin/share/yolov8_trt_bed_detect_orin/launch
      - ./vision/ai/yolov8_trt_bed_detect_orin/web_server:/ros2_ws/install/yolov8_trt_bed_detect_orin/share/yolov8_trt_bed_detect_orin/web_server
      - ${HOME}/saved_frames:/saved_frames
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    # privileged: false
    runtime: nvidia
    restart: always
    # depends_on:
    #   yolov8-trt-serialize-x86-jazzy:
    #     condition: service_completed_successfully
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch yolov8_trt_bed_detect_orin yolov8_web.launch.py"

  rosbag_recorder:
    image: meraquetech/race_nav:bwt901ble_imu.humble.jetson.v2
    container_name: rosbag_recorder
    depends_on:
      - imu_gnss_raw
    network_mode: host
    ipc: host
    restart: always
    user: "0:0"
    tty: true
    volumes:
      - ./bags:/bags
      - ./cyclone_dds_profile.xml:/dds_ws/cyclone_dds_profile.xml:ro
    environment:
      - HOME=/tmp
      - ROS_HOME=/tmp/ros
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///dds_ws/cyclone_dds_profile.xml
    command: >
      bash -c "
      sleep 10 &&
      source /opt/ros/humble/setup.bash &&
      ros2 bag record
      -o /bags/imu_gps_$(date +%Y%m%d_%H%M%S)
      /gnss/pvt
      /imu/data
      "
